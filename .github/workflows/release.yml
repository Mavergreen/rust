name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

# spec: shipyard SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      # spec: shipyard SKILL.md "A release is a declared state, not an event" -- a dispatch publishes only if release-needed.sh
      #       still says PUBLISH; only refs/heads/main publishes, so a dispatch on a branch is a dry run
      - id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mode="$(sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main) : ;;
            workflow_dispatch:refs/heads/main)
              if [ "$mode" = auto ] && [ "$rel" != yes ]; then
                digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
                answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full" --repo "$GITHUB_REPOSITORY")"
                echo "release-needed: $answer"
                if [ "$answer" = PUBLISH ]; then
                  out="$(sh build/version.sh local)"
                  full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
                  rel=yes
                fi
              fi ;;
            *) rel=no ;;
          esac
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

  build-native:
    needs: ver
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # platform: only an explicit bash shell runs with pipefail, and the build pipes into tee
    defaults:
      run:
        shell: bash
    env:
      MAVERICKS_USE_CCACHE: "1"
      # platform: the build triple's compilers are wrapper scripts whose flags --version cannot see;
      #           content hashes the wrapper itself, which the build writes byte-identically each run
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: Free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D11 (shipyard) -- the work tree goes on the runner's largest free volume
      - name: Work on the largest free volume
        run: |
          best=""; bestk=0
          for v in / /mnt; do
            [ -d "$v" ] || continue
            k="$(df -Pk "$v" | awk 'NR == 2 { print $4 }')"
            if [ "$k" -gt "$bestk" ]; then best="$v"; bestk="$k"; fi
          done
          w="${best%/}/mavergreen-rust"
          sudo mkdir -p "$w" && sudo chown -R "$(id -u):$(id -g)" "$w"
          mkdir -p "$HOME/.cache/ccache"
          echo "MAVERICKS_WORK=$w" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "work on $w ($((bestk / 1048576)) GB free)"
      - name: Ensure ccache and ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache ninja-build
          cmake --version | head -1; ninja --version; make --version | head -1; ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}
          restore-keys: ccache-native-linux-
      - name: Build
        id: build
        run: |
          ccache -z
          date -u +%s > "$RUNNER_TEMP/start"
          ( while :; do df -Pk "$MAVERICKS_WORK" | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/disk-used"; sleep 60; done ) &
          sh build/build-native.sh 2>&1 | tee "$RUNNER_TEMP/build-native.log"
      # spec: docs/superpowers/specs/2026-09-25-rust-plan3b-release-design.md "Caching" -- a cache key
      #       can't be overwritten, so a run that fails or times out saves under a per-run key
      - name: Save ccache even when the build or a later step fails
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package
        run: sh build/package-native-pkg.sh 2>&1 | tee "$RUNNER_TEMP/package-native.log"
      - name: Wall time, ccache and disk
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/start" ] || echo "build wall time: $(( ($(date -u +%s) - $(cat "$RUNNER_TEMP/start")) / 60 )) min"
          ccache -sv || true
          du -sh "$HOME/.cache/ccache" 2>/dev/null || true
          [ ! -f "$RUNNER_TEMP/disk-used" ] || echo "disk peak on the work volume: $(( $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) / 1048576 )) GB used"
          du -sh "$MAVERICKS_WORK" 2>/dev/null || true
          df -h / /mnt
      - name: The build and the packager ran no xcrun, /usr/bin/clang or pkgutil
        run: sh build/assert-no-apple-host-tools.sh "$RUNNER_TEMP/build-native.log" "$RUNNER_TEMP/package-native.log"
      - name: Tests, with the stage
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host
      - uses: actions/upload-artifact@v7
        with:
          name: dist-native
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/build-info-*.txt
      - name: The build logs, when the job fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-native
          path: ${{ runner.temp }}/*.log
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  build-cross:
    needs: ver
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # platform: only an explicit bash shell runs with pipefail, and the build pipes into tee
    defaults:
      run:
        shell: bash
    env:
      MAVERICKS_USE_CCACHE: "1"
      # platform: the build triple's compilers are wrapper scripts whose flags --version cannot see;
      #           content hashes the wrapper itself, which the build writes byte-identically each run
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: Free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D11 (shipyard) -- the work tree goes on the runner's largest free volume
      - name: Work on the largest free volume
        run: |
          best=""; bestk=0
          for v in / /mnt; do
            [ -d "$v" ] || continue
            k="$(df -Pk "$v" | awk 'NR == 2 { print $4 }')"
            if [ "$k" -gt "$bestk" ]; then best="$v"; bestk="$k"; fi
          done
          w="${best%/}/mavergreen-rust"
          sudo mkdir -p "$w" && sudo chown -R "$(id -u):$(id -g)" "$w"
          mkdir -p "$HOME/.cache/ccache"
          echo "MAVERICKS_WORK=$w" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "work on $w ($((bestk / 1048576)) GB free)"
      - name: Ensure ccache and ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache ninja-build
          cmake --version | head -1; ninja --version; make --version | head -1; ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-cross-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}
          restore-keys: |
            ccache-cross-linux-
            ccache-native-linux-
      - name: Build
        id: build
        run: |
          ccache -z
          date -u +%s > "$RUNNER_TEMP/start"
          ( while :; do df -Pk "$MAVERICKS_WORK" | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/disk-used"; sleep 60; done ) &
          sh build/build-cross.sh 2>&1 | tee "$RUNNER_TEMP/build-cross.log"
      # spec: docs/superpowers/specs/2026-09-25-rust-plan3b-release-design.md "Caching" -- a cache key
      #       can't be overwritten, so a run that fails or times out saves under a per-run key
      - name: Save ccache even when the build or a later step fails
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-cross-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package
        run: sh build/package-cross-pkg.sh 2>&1 | tee "$RUNNER_TEMP/package-cross.log"
      - name: Wall time, ccache and disk
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/start" ] || echo "build wall time: $(( ($(date -u +%s) - $(cat "$RUNNER_TEMP/start")) / 60 )) min"
          ccache -sv || true
          du -sh "$HOME/.cache/ccache" 2>/dev/null || true
          [ ! -f "$RUNNER_TEMP/disk-used" ] || echo "disk peak on the work volume: $(( $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) / 1048576 )) GB used"
          du -sh "$MAVERICKS_WORK" 2>/dev/null || true
