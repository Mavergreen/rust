      - name: Tests, with the stage
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host
      - uses: actions/upload-artifact@v7
        with:
          name: dist-cross
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/build-info-*.txt
