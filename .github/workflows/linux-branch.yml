name: linux-branch

on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      # platform: the tests fetch clang22's Linux archive and the 10.9 SDK in parallel; one fetch first
      #           keeps them from downloading the same archive at once
      - name: Fetch clang22 and the 10.9 SDK
        run: |
          sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" components/clang22
          sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh"
      - name: Tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host

  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # platform: only an explicit bash shell runs with pipefail, and the build pipes into tee
    defaults:
      run:
        shell: bash
    env:
      MAVERICKS_USE_CCACHE: "1"
      # platform: the build triple's compilers are wrapper scripts whose flags --version cannot see;
      #           content hashes the wrapper itself, which the build writes byte-identically each run
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D11 (shipyard) -- the work tree goes on the runner's largest free volume
      - name: Work on the largest free volume
        run: |
          best=""; bestk=0
          for v in / /mnt; do
            [ -d "$v" ] || continue
            k="$(df -Pk "$v" | awk 'NR == 2 { print $4 }')"
            if [ "$k" -gt "$bestk" ]; then best="$v"; bestk="$k"; fi
          done
          w="${best%/}/mavergreen-rust"
          sudo mkdir -p "$w" && sudo chown "$(id -u):$(id -g)" "$w"
          echo "MAVERICKS_WORK=$w" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "work on $w ($((bestk / 1048576)) GB free)"
      - name: Ensure ccache and ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache ninja-build
          cmake --version | head -1; ninja --version; make --version | head -1; ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}
          restore-keys: ccache-native-linux-
      - name: Build
        id: build
        run: |
          ccache -z
          date -u +%s > "$RUNNER_TEMP/start"
          ( while :; do df -Pk "$MAVERICKS_WORK" | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/disk-used"; sleep 60; done ) &
          sh build/build-native.sh 2>&1 | tee "$RUNNER_TEMP/build-native.log"
      - name: Package
        run: sh build/package-native-pkg.sh 2>&1 | tee "$RUNNER_TEMP/package-native.log"
      - name: Save ccache even when the build fails
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wall time, ccache and disk
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/start" ] || echo "build wall time: $(( ($(date -u +%s) - $(cat "$RUNNER_TEMP/start")) / 60 )) min"
          ccache -sv || true
          du -sh "$HOME/.cache/ccache" 2>/dev/null || true
          [ ! -f "$RUNNER_TEMP/disk-used" ] || echo "disk peak on the work volume: $(( $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) / 1048576 )) GB used"
          du -sh "$MAVERICKS_WORK" 2>/dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md "Review Focus" (shipyard) -- rustc's Apple-target links get their SDK and linker from us
      - name: The build and the packager ran no xcrun, /usr/bin/clang or pkgutil
        run: |
          for l in build-native package-native; do
            if grep -nE 'xcrun|/usr/bin/clang|pkgutil' "$RUNNER_TEMP/$l.log"; then
              echo "::error::the $l log names xcrun, /usr/bin/clang or pkgutil"; exit 1
            fi
            echo "no xcrun, /usr/bin/clang or pkgutil in $(wc -l < "$RUNNER_TEMP/$l.log") $l log lines"
          done
      - name: Tests, with the stage
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host
      - name: Pack the stage and the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build-native.log" "$RUNNER_TEMP/package-native.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          w="$MAVERICKS_WORK/work-native"
          [ ! -d "$w/stage" ] || tar -czf "$RUNNER_TEMP/out/stage-native.tar.gz" -C "$w/stage" .
          cp dist/*.pkg dist/build-info-*.txt "$w/staged.stamp" "$RUNNER_TEMP/out/" 2>/dev/null || true
          find "$w" -path '*/CMakeFiles/CMakeConfigureLog.yaml' -o -path '*/CMakeFiles/CMakeError.log' -o -name bootstrap.toml 2>/dev/null \
            | tar -czf "$RUNNER_TEMP/out/build-logs.tar.gz" -T - 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-native-linux
          path: ${{ runner.temp }}/out

  build-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # platform: only an explicit bash shell runs with pipefail, and the build pipes into tee
    defaults:
      run:
        shell: bash
    env:
      MAVERICKS_USE_CCACHE: "1"
      # platform: the build triple's compilers are wrapper scripts whose flags --version cannot see;
      #           content hashes the wrapper itself, which the build writes byte-identically each run
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D11 (shipyard) -- the work tree goes on the runner's largest free volume
      - name: Work on the largest free volume
        run: |
          best=""; bestk=0
          for v in / /mnt; do
            [ -d "$v" ] || continue
            k="$(df -Pk "$v" | awk 'NR == 2 { print $4 }')"
            if [ "$k" -gt "$bestk" ]; then best="$v"; bestk="$k"; fi
          done
          w="${best%/}/mavergreen-rust"
          sudo mkdir -p "$w" && sudo chown "$(id -u):$(id -g)" "$w"
          echo "MAVERICKS_WORK=$w" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "work on $w ($((bestk / 1048576)) GB free)"
      - name: Ensure ccache and ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache ninja-build
          cmake --version | head -1; ninja --version; make --version | head -1; ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-cross-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}
          restore-keys: |
            ccache-cross-linux-
            ccache-native-linux-
      - name: Build
        id: build
        run: |
          ccache -z
          date -u +%s > "$RUNNER_TEMP/start"
          ( while :; do df -Pk "$MAVERICKS_WORK" | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/disk-used"; sleep 60; done ) &
          sh build/build-cross.sh 2>&1 | tee "$RUNNER_TEMP/build-cross.log"
      - name: Package
        run: sh build/package-cross-pkg.sh 2>&1 | tee "$RUNNER_TEMP/package-cross.log"
      - name: Save ccache even when the build fails
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-cross-linux-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wall time, ccache and disk
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/start" ] || echo "build wall time: $(( ($(date -u +%s) - $(cat "$RUNNER_TEMP/start")) / 60 )) min"
          ccache -sv || true
          du -sh "$HOME/.cache/ccache" 2>/dev/null || true
          [ ! -f "$RUNNER_TEMP/disk-used" ] || echo "disk peak on the work volume: $(( $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) / 1048576 )) GB used"
          du -sh "$MAVERICKS_WORK" 2>/dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md "Review Focus" (shipyard) -- rustc's Apple-target links get their SDK and linker from us
      - name: The build and the packager ran no xcrun, /usr/bin/clang or pkgutil
        run: |
          for l in build-cross package-cross; do
            if grep -nE 'xcrun|/usr/bin/clang|pkgutil' "$RUNNER_TEMP/$l.log"; then
              echo "::error::the $l log names xcrun, /usr/bin/clang or pkgutil"; exit 1
            fi
            echo "no xcrun, /usr/bin/clang or pkgutil in $(wc -l < "$RUNNER_TEMP/$l.log") $l log lines"
          done
      - name: Tests, with the stage
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host
      - name: Pack the stage and the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build-cross.log" "$RUNNER_TEMP/package-cross.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          w="$MAVERICKS_WORK/work-cross"
          [ ! -d "$w/stage" ] || tar -czf "$RUNNER_TEMP/out/stage-cross.tar.gz" -C "$w/stage" .
          cp dist/*.pkg dist/build-info-*.txt "$w/staged.stamp" "$RUNNER_TEMP/out/" 2>/dev/null || true
          find "$w" -path '*/CMakeFiles/CMakeConfigureLog.yaml' -o -path '*/CMakeFiles/CMakeError.log' -o -name bootstrap.toml 2>/dev/null \
            | tar -czf "$RUNNER_TEMP/out/build-logs.tar.gz" -T - 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-cross-linux
          path: ${{ runner.temp }}/out

  # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D7 (shipyard) -- the Linux tarball is built and smoked inside clang-22's pinned base image, the family's glibc floor
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # platform: only an explicit bash shell runs with pipefail, and the build pipes into tee
    defaults:
      run:
        shell: bash
    env:
      MAVERICKS_USE_CCACHE: "1"
      # platform: the build triple's compilers are wrapper scripts whose flags --version cannot see;
      #           content hashes the wrapper itself, which the build writes byte-identically each run
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md D11 (shipyard) -- the work tree goes on the runner's largest free volume
      - name: Work on the largest free volume
        run: |
          best=""; bestk=0
          for v in / /mnt; do
            [ -d "$v" ] || continue
            k="$(df -Pk "$v" | awk 'NR == 2 { print $4 }')"
            if [ "$k" -gt "$bestk" ]; then best="$v"; bestk="$k"; fi
          done
          w="${best%/}/mavergreen-rust"
          sudo mkdir -p "$w/home" && sudo chown -R "$(id -u):$(id -g)" "$w"
          mkdir -p "$HOME/.cache/ccache"
          echo "MAVERICKS_WORK=$w" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "work on $w ($((bestk / 1048576)) GB free)"
      # platform: the container sees the checkout, shipyard and the work volume at their runner paths, so
      #           a path one step records is the path the next one reads
      - name: clang-22's pinned Linux base image
        run: |
          pin="$(tr -d ' \t\n' < components/clang22/version)"
          c="$RUNNER_TEMP/clang-22"
          git clone -q --depth 1 --branch "$pin" --filter=blob:none --sparse https://github.com/Mavergreen/clang-22.git "$c"
          git -C "$c" sparse-checkout set build/linux
          echo "base image: $(cat "$c/build/linux/base-image") (clang-22 $pin)"
          docker build -q --build-arg "BASE_IMAGE=$(cat "$c/build/linux/base-image")" -t clang22-linux-base "$c/build/linux"
          s="$(cd -P "$SHIPYARD_SCRIPTS" && pwd)"
          {
            echo "SHIPYARD_REAL=$s"
            echo "DOCKER_MOUNTS=-v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -v $(dirname "$s"):$(dirname "$s"):ro -v $MAVERICKS_WORK:$MAVERICKS_WORK -v $CCACHE_DIR:$CCACHE_DIR -w $GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          docker build -q --build-arg BASE=clang22-linux-base -t rust-linux-build build/linux
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-hosted-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh', 'build/linux/Dockerfile') }}
          restore-keys: ccache-linux-hosted-
      - name: Build
        id: build
        run: |
          date -u +%s > "$RUNNER_TEMP/start"
          ( while :; do df -Pk "$MAVERICKS_WORK" | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/disk-used"; sleep 60; done ) &
          docker run --rm --user "$(id -u):$(id -g)" $DOCKER_MOUNTS \
            -e SHIPYARD_SCRIPTS="$SHIPYARD_REAL" -e MAVERICKS_WORK -e HOME="$MAVERICKS_WORK/home" \
            -e MAVERICKS_USE_CCACHE -e CCACHE_COMPILERCHECK -e CCACHE_DIR \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            rust-linux-build sh -c 'ccache -z && sh build/build-linux.sh' 2>&1 | tee "$RUNNER_TEMP/build-linux.log"
      - name: Package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" $DOCKER_MOUNTS \
            -e SHIPYARD_SCRIPTS="$SHIPYARD_REAL" -e MAVERICKS_WORK -e HOME="$MAVERICKS_WORK/home" \
            -e GITHUB_EVENT_NAME -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            rust-linux-build sh build/package-linux.sh 2>&1 | tee "$RUNNER_TEMP/package-linux.log"
      - name: Save ccache even when the build fails
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-hosted-${{ hashFiles('UPSTREAM_VERSION', 'components/**', '!components/longboat/**', 'build/lib-rust.sh', 'build/build-*.sh', 'build/linux/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wall time, ccache and disk
        if: always()
        run: |
          [ ! -f "$RUNNER_TEMP/start" ] || echo "build wall time: $(( ($(date -u +%s) - $(cat "$RUNNER_TEMP/start")) / 60 )) min"
          docker run --rm --user "$(id -u):$(id -g)" -v "$CCACHE_DIR:$CCACHE_DIR" -e CCACHE_DIR rust-linux-build ccache -sv || true
          du -sh "$HOME/.cache/ccache" 2>/dev/null || true
          [ ! -f "$RUNNER_TEMP/disk-used" ] || echo "disk peak on the work volume: $(( $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) / 1048576 )) GB used"
          du -sh "$MAVERICKS_WORK" 2>/dev/null || true
          df -h / /mnt
      # spec: .superpowers/plans/2026-10-24-macos-runner-exit/06-rust-and-codex-cli.md "Review Focus" (shipyard) -- rustc's Apple-target links get their SDK and linker from us
      - name: The build and the packager ran no xcrun, /usr/bin/clang or pkgutil
        run: |
          for l in build-linux package-linux; do
            if grep -nE 'xcrun|/usr/bin/clang|pkgutil' "$RUNNER_TEMP/$l.log"; then
              echo "::error::the $l log names xcrun, /usr/bin/clang or pkgutil"; exit 1
            fi
            echo "no xcrun, /usr/bin/clang or pkgutil in $(wc -l < "$RUNNER_TEMP/$l.log") $l log lines"
          done
      - name: Smoke on clang-22's base image
        run: |
          tb="$(echo "$GITHUB_WORKSPACE"/dist/rust-*-linux-x86_64.tar.gz)"
          docker run --rm --user "$(id -u):$(id -g)" $DOCKER_MOUNTS \
            -e SHIPYARD_SCRIPTS="$SHIPYARD_REAL" -e MAVERICKS_WORK -e HOME="$MAVERICKS_WORK/home" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            clang22-linux-base sh tests/linux-smoke.sh "$tb" 2>&1 | tee "$RUNNER_TEMP/linux-smoke.log"
      - name: Pack the tarball and the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/*-linux.log "$RUNNER_TEMP/linux-smoke.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          w="$MAVERICKS_WORK/work-linux"
          cp dist/rust-*-linux-x86_64.tar.gz dist/build-info-linux.txt "$w/staged.stamp" "$RUNNER_TEMP/out/" 2>/dev/null || true
          find "$w" -path '*/CMakeFiles/CMakeConfigureLog.yaml' -o -path '*/CMakeFiles/CMakeError.log' -o -name bootstrap.toml 2>/dev/null \
            | tar -czf "$RUNNER_TEMP/out/build-logs.tar.gz" -T - 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-linux
          path: ${{ runner.temp }}/out
