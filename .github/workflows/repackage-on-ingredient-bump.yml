name: repackage-on-ingredient-bump

on:
  push:
    branches: [main]
    paths:
      - components/**
      # spec: INGREDIENTS.md "Check-only pins" -- nothing shipped is built with Longboat
      - '!components/longboat/**'

jobs:
  repackage:
    permissions:
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/repackage-on-ingredient-bump.yml@v1
    with:
      own-upstream-paths: UPSTREAM_VERSION
